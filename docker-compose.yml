version: '3.8'
services:
  proxy-pool:
    build: .
    container_name: proxy-pool-manager
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - proxy-pool-data:/app/data
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  proxy-pool-data:
    driver: local
